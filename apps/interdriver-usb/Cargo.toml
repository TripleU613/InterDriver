[package]
name = "interdriver-usb"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
interdriver-driver-core = { path = "../../crates/driver-core" }
interdriver-usbip-session = { path = "../../crates/usbip-session" }
interdriver-usbip-client = { path = "../../crates/usbip-client" }
interdriver-control-plane = { path = "../../crates/control-plane" }

[target.'cfg(target_os = "linux")'.dependencies]
interdriver-platform-linux = { path = "../../crates/platform-linux" }
interdriver-usbfs-linux = { path = "../../crates/usbfs-linux" }
interdriver-gadget-linux = { path = "../../crates/gadget-linux" }
interdriver-usbip-server = { path = "../../crates/usbip-server" }
signal-hook = "0.3.18"

[target.'cfg(target_os = "windows")'.dependencies]
interdriver-platform-windows = { path = "../../crates/platform-windows" }
interdriver-usbip-server = { path = "../../crates/usbip-server" }

[target.'cfg(target_os = "macos")'.dependencies]
interdriver-platform-macos = { path = "../../crates/platform-macos" }

[lints]
workspace = true
